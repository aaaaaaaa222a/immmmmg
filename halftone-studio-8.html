/* ============================= BACKGROUND REMOVAL (simple color-based cutout) ============================= */
let bgRemoveState = null; // {layerId, tolerance, original: canvas}

function enterBgRemoveMode(id){
  const l = getLayer(id);
  if(!l || l.type!=='image' || l.locked) return;
  const orig = document.createElement('canvas');
  orig.width = l.origCanvas.width; orig.height = l.origCanvas.height;
  orig.getContext('2d').drawImage(l.origCanvas,0,0);
  bgRemoveState = { layerId:id, tolerance:30, original: orig };
  applyBgRemovePreview();
  renderProps(); render();
}
function removeBackgroundFlood(imgData, tolerance){
  const data = imgData.data;
  const w = imgData.width, h = imgData.height;
  const visited = new Uint8Array(w*h);
  const queue = [];
  const push = (x,y)=>{ if(x<0||y<0||x>=w||y>=h) return; const idx=y*w+x; if(!visited[idx]){ visited[idx]=1; queue.push(idx); } };
  for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
  for(let y=0;y<h;y++){ push(0,y); push(w-1,y); }
  const thresh = tolerance*3;
  let head = 0;
  while(head < queue.length){
    const idx = queue[head++];
    const x = idx%w, y = (idx/w)|0;
    const a = idx*4;
    const r=data[a], g=data[a+1], b=data[a+2];
    data[a+3] = 0;
    const neigh = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    for(const [nx,ny] of neigh){
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const nidx = ny*w+nx;
      if(visited[nidx]) continue;
      const na = nidx*4;
      const dr=data[na]-r, dg=data[na+1]-g, db=data[na+2]-b;
      if(Math.sqrt(dr*dr+dg*dg+db*db) < thresh){ visited[nidx]=1; queue.push(nidx); }
    }
  }
}
function applyBgRemovePreview(){
  const st = bgRemoveState; if(!st) return;
  const l = getLayer(st.layerId); if(!l) return;
  const w = st.original.width, h = st.original.height;
  const imgData = st.original.getContext('2d').getImageData(0,0,w,h);
  removeBackgroundFlood(imgData, st.tolerance);
  const outCanvas = document.createElement('canvas'); outCanvas.width=w; outCanvas.height=h;
  outCanvas.getContext('2d').putImageData(imgData,0,0);
  l.origCanvas = outCanvas;
  if(imageAssets[l.id]) imageAssets[l.id].origCanvas = outCanvas;
  processImageEffect(l);
}
function applyBgRemove(){ bgRemoveState=null; renderProps(); render(); commitHistory(); }
function cancelBgRemove(){
  const st = bgRemoveState; if(!st) return;
  const l = getLayer(st.layerId);
  if(l){ l.origCanvas = st.original; if(imageAssets[l.id]) imageAssets[l.id].origCanvas = st.original; processImageEffect(l); }
  bgRemoveState = null; renderProps(); render();
}

/* ============================= LASSO CUTOUT (point-based polygon, keeps only the traced area) ============================= */
let lassoState = null; // {layerId, cx,cy,rot,w,h, points:[{x,y} local coords], dragPointIndex}

function enterLassoMode(id){
  const l = getLayer(id);
  if(!l || l.type!=='image' || l.locked) return;
  lassoState = { layerId:id, cx:l.x, cy:l.y, rot:l.rotation, w:l.w, h:l.h, points:[], dragPointIndex:null };
  renderProps(); render();
}
function cancelLasso(){ lassoState=null; renderProps(); render(); }
function clearLassoPoints(){ if(lassoState){ lassoState.points=[]; lassoState.dragPointIndex=null; render(); } }
function lassoPointAt(ls, loc){
  const r = 14;
  for(let i=0;i<ls.points.length;i++){
    const p = ls.points[i];
    if(Math.hypot(loc.x-p.x, loc.y-p.y) < r) return i;
  }
  return -1;
}
function distToSegment(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const len2 = dx*dx+dy*dy;
  if(len2===0) return Math.hypot(p.x-a.x,p.y-a.y);
  let t = ((p.x-a.x)*dx + (p.y-a.y)*dy)/len2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function lassoSegmentInsertAt(ls, loc){
  const n = ls.points.length;
  if(n<2) return null;
  let best = null, bestDist = 16;
  for(let i=0;i<n;i++){
    if(i===n-1 && n<3) break; // closing edge only exists once the polygon has 3+ points
    const a = ls.points[i], b = ls.points[(i+1)%n];
    const d = distToSegment(loc, a, b);
    if(d<bestDist){ bestDist=d; best=i+1; }
  }
  return best;
}
function lassoDeletePoint(ls, idx){
  if(ls.points.length<=3) return; // keep at least a triangle
  ls.points.splice(idx,1);
  if(ls.dragPointIndex===idx) ls.dragPointIndex=null;
}
function applyLasso(){
  if(!lassoState || lassoState.points.length<3){ alert('올가미로 3개 이상의 점을 찍어서 영역을 만들어주세요.'); return; }
  const l = getLayer(lassoState.layerId); if(!l) return;
  const oc = l.origCanvas;
  const sx = oc.width/lassoState.w, sy = oc.height/lassoState.h;
  const mask = document.createElement('canvas'); mask.width=oc.width; mask.height=oc.height;
  const mctx = mask.getContext('2d');
  mctx.beginPath();
  lassoState.points.forEach((p,i)=>{
    const px = (p.x + lassoState.w/2)*sx, py = (p.y + lassoState.h/2)*sy;
    if(i===0) mctx.moveTo(px,py); else mctx.lineTo(px,py);
  });
  mctx.closePath();
  mctx.fillStyle = '#fff';
  mctx.fill();

  const newCanvas = document.createElement('canvas'); newCanvas.width=oc.width; newCanvas.height=oc.height;
  const nctx = newCanvas.getContext('2d');
  nctx.drawImage(oc,0,0);
  nctx.globalCompositeOperation = 'destination-in';
  nctx.drawImage(mask,0,0);

  l.origCanvas = newCanvas;
  if(imageAssets[l.id]) imageAssets[l.id].origCanvas = newCanvas;
  processImageEffect(l);
  lassoState = null;
  renderProps(); render(); commitHistory();
}
function drawLassoOverlay(){
  const l = getLayer(lassoState.layerId);
  if(!l){ lassoState=null; return; }
  const ls = lassoState;
  const src = l.processed || l.origCanvas;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.translate(ls.cx, ls.cy);
  ctx.rotate(ls.rot*Math.PI/180);
  ctx.drawImage(src, -ls.w/2, -ls.h/2, ls.w, ls.h);
  if(ls.points.length){
    ctx.strokeStyle = '#2f5bff'; ctx.lineWidth = 2; ctx.setLineDash([7,5]);
    ctx.beginPath();
    ls.points.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    if(ls.points.length>=3) ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ls.points.forEach((p,i)=>{
      const dragging = ls.dragPointIndex===i;
      ctx.beginPath(); ctx.arc(p.x,p.y, dragging?7:5, 0, Math.PI*2);
      ctx.fillStyle = dragging ? '#ff4d4d' : '#2f5bff';
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    });
  }
  ctx.restore();
}

/* ============================= IN-CANVAS TEXT EDITING ============================= */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function runsToHTML(layer){
  if(!layer.runs || !layer.runs.length) return escapeHtml(layer.text||'');
  return layer.runs.map(line=> line.map(r=>{
    let html = escapeHtml(r.text);
    if(r.bold) html = `<b>${html}</b>`;
    if(r.italic) html = `<i>${html}</i>`;
    if(r.underline) html = `<u>${html}</u>`;
    if(r.strike) html = `<s>${html}</s>`;
    let style = '';
    if(r.color) style += `color:${r.color};`;
    if(r.highlight) style += `background:${r.highlight};border-radius:2px;`;
    if(style) html = `<span style="${style}">${html}</span>`;
    return html;
  }).join('')).join('\n');
}

function collectRuns(node, style, out){
  if(node.nodeType === 3){
    if(node.nodeValue.length) out.push(Object.assign({text:node.nodeValue}, style));
    return;
  }
  if(node.nodeType !== 1) return;
  const st = Object.assign({}, style);
  const tag = node.tagName;
  if(tag==='B'||tag==='STRONG') st.bold = true;
  if(tag==='I'||tag==='EM') st.italic = true;
  if(tag==='U') st.underline = true;
  if(tag==='S'||tag==='STRIKE') st.strike = true;
  const cs = node.style;
  if(cs && cs.color) st.color = cs.color;
  if(cs && node.classList && node.classList.contains('hl')){
    const hl = cs.getPropertyValue('--hl').trim() || cs.background;
    if(hl) st.highlight = hl;
  }
  if(cs && cs.textDecorationLine){
    if(cs.textDecorationLine.includes('underline')) st.underline = true;
    if(cs.textDecorationLine.includes('line-through')) st.strike = true;
  }
  node.childNodes.forEach(ch=> collectRuns(ch, st, out));
}
function parseEditorToRuns(editorEl){
  const flat = [];
  editorEl.childNodes.forEach(ch=> collectRuns(ch, {bold:null,italic:null,underline:null,strike:null,color:null,highlight:null}, flat));
  const lines = [[]];
  flat.forEach(run=>{
    const parts = run.text.split('\n');
    parts.forEach((part,i)=>{
      if(i>0) lines.push([]);
      if(part.length) lines[lines.length-1].push(Object.assign({}, run, {text:part}));
    });
  });
  return lines;
}

function openTextEditor(layer){
  closeTextEditor();
  const rect = stage.getBoundingClientRect();
  const scale = rect.width/CANVAS_W;

  const editor = document.createElement('div');
  editor.id = 'inlineTextEditor';
  editor.contentEditable = 'true';
  editor.spellcheck = false;
  editor.innerHTML = runsToHTML(layer);
  Object.assign(editor.style, {
    position:'fixed',
    left:(rect.left + layer.x*scale)+'px',
    top:(rect.top + layer.y*scale)+'px',
    minWidth:'60px',
    maxWidth:'80vw',
    transform:`translate(-50%,-50%) rotate(${layer.rotation}deg)`,
    font:`${layer.italic?'italic ':''}${layer.weight||400} ${Math.max(10,layer.size*scale)}px "${layer.font}"`,
    color:layer.color,
    textAlign:layer.align,
    background:'rgba(255,255,255,.95)',
    border:'2px dashed #2f5bff',
    borderRadius:'6px',
    padding:'8px 10px',
    outline:'none',
    zIndex:'999',
    lineHeight:'1.25',
    whiteSpace:'pre-wrap',
    boxShadow:'0 4px 18px rgba(0,0,0,.25)'
  });
  document.body.appendChild(editor);

  const bbBtn = 'width:24px;height:24px;border:none;border-radius:5px;background:#2a2d38;color:#e8e8ee;font-size:12px;cursor:pointer;';
  const bubble = document.createElement('div');
  bubble.id = 'textBubble';
  Object.assign(bubble.style, {
    position:'fixed', zIndex:'1000', display:'none',
    background:'#1a1c24', border:'1px solid #383b47', borderRadius:'8px',
    padding:'5px 6px', boxShadow:'0 6px 20px rgba(0,0,0,.4)'
  });
  bubble.innerHTML = `
    <div style="display:flex;gap:3px;align-items:center;">
      <button data-cmd="bold" style="${bbBtn}"><b>B</b></button>
      <button data-cmd="italic" style="${bbBtn}"><i>I</i></button>
      <button data-cmd="underline" style="${bbBtn}"><u>U</u></button>
      <button data-cmd="strikeThrough" style="${bbBtn}"><s>S</s></button>
      <span style="width:1px;height:18px;background:#383b47;margin:0 2px;"></span>
      ${['#ff5c5c','#5c8bff','#5cff8b','#ffe45c','#ffffff'].map(c=>`<button data-color="${c}" style="${bbBtn};background:${c};width:18px;"></button>`).join('')}
      <input type="color" id="bbColorCustom" title="글자색" style="width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;">
      <span style="width:1px;height:18px;background:#383b47;margin:0 2px;"></span>
      ${['#fff45c','#5cffb0','#ff9ecf'].map(c=>`<button data-hl="${c}" style="${bbBtn};background:${c};width:18px;"></button>`).join('')}
      <button data-hl="" title="형광펜 지우기" style="${bbBtn};font-size:9px;">지움</button>
    </div>`;
  document.body.appendChild(bubble);

  let savedRange = null;
  function updateBubblePosition(){
    const sel = window.getSelection();
    if(!sel.rangeCount || sel.isCollapsed){ bubble.style.display='none'; return; }
    const range = sel.getRangeAt(0);
    if(!editor.contains(range.commonAncestorContainer)){ bubble.style.display='none'; return; }
    savedRange = range.cloneRange();
    const r = range.getBoundingClientRect();
    if(r.width===0 && r.height===0){ bubble.style.display='none'; return; }
    bubble.style.display = 'block';
    const bw = bubble.offsetWidth || 260;
    let left = r.left + r.width/2 - bw/2;
    left = Math.max(8, Math.min(left, window.innerWidth-bw-8));
    let top = r.top - 42;
    if(top < 8) top = r.bottom + 8;
    bubble.style.left = left+'px'; bubble.style.top = top+'px';
  }
  function onSelChange(){
    const sel = window.getSelection();
    if(sel.rangeCount && !sel.isCollapsed && editor.contains(sel.getRangeAt(0).commonAncestorContainer)){
      updateBubblePosition();
    } else if(!bubble.matches(':hover')){
      bubble.style.display = 'none';
    }
  }
  document.addEventListener('selectionchange', onSelChange);

  function restoreSel(){
    if(!savedRange) return null;
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(savedRange);
    return savedRange;
  }
  function wrapSel(styleSetter){
    const range = restoreSel(); if(!range) return;
    const span = document.createElement('span');
    styleSetter(span);
    try{ range.surroundContents(span); }
    catch(err){ const frag = range.extractContents(); span.appendChild(frag); range.insertNode(span); }
    const sel = window.getSelection();
    sel.removeAllRanges();
    const nr = document.createRange(); nr.selectNodeContents(span); nr.collapse(false); sel.addRange(nr);
    savedRange = null;
  }
  bubble.addEventListener('mousedown', e=>{ if(e.target.closest('button')) e.preventDefault(); });
  bubble.querySelectorAll('[data-cmd]').forEach(b=>{
    b.addEventListener('click', ()=>{ restoreSel(); document.execCommand(b.dataset.cmd); editor.focus(); });
  });
  bubble.querySelectorAll('[data-color]').forEach(b=>{
    b.addEventListener('click', ()=> wrapSel(span=> span.style.color = b.dataset.color));
  });
  document.getElementById('bbColorCustom').addEventListener('input', e=> wrapSel(span=> span.style.color = e.target.value));
  bubble.querySelectorAll('[data-hl]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.dataset.hl===''){
        const range = restoreSel(); if(!range) return;
        editor.querySelectorAll('.hl').forEach(el=>{
          if(range.intersectsNode(el)){
            const parent = el.parentNode;
            while(el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
          }
        });
        editor.normalize(); savedRange = null;
      } else {
        wrapSel(span=>{ span.classList.add('hl'); span.style.background = b.dataset.hl; span.style.borderRadius='2px'; });
      }
    });
  });

  function commit(){
    layer.runs = parseEditorToRuns(editor);
    const joined = layer.runs.map(line=> line.map(r=>r.text).join('')).join('\n');
    layer.text = joined || layer.text;
    document.removeEventListener('selectionchange', onSelChange);
    document.removeEventListener('mousedown', outsideDown, true);
    closeTextEditor();
    measureText(layer); render(); commitHistory();
  }
  editor.addEventListener('keydown', ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter' && !ev.shiftKey){
      ev.preventDefault();
      const sel = window.getSelection();
      if(!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const nl = document.createTextNode('\n');
      range.insertNode(nl);
      const nr = document.createRange(); nr.setStartAfter(nl); nr.collapse(true);
      sel.removeAllRanges(); sel.addRange(nr);
    }
    if(ev.key==='Escape'){ document.removeEventListener('selectionchange', onSelChange); document.removeEventListener('mousedown', outsideDown, true); closeTextEditor(); render(); }
  });
  function outsideDown(ev){
    if(!editor.contains(ev.target) && !bubble.contains(ev.target)) commit();
  }
  setTimeout(()=> document.addEventListener('mousedown', outsideDown, true), 0);

  editor.focus();
  const r = document.createRange(); r.selectNodeContents(editor); r.collapse(false);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function closeTextEditor(){
  const editor = document.getElementById('inlineTextEditor');
  const bubble = document.getElementById('textBubble');
  if(editor) editor.remove();
  if(bubble) bubble.remove();
}

stage.addEventListener('mousedown', e=>{
  if(handToolActive) return; /* handled by canvasArea listener below, works over empty space too */
  const m = getMouse(e);

  if(cropState){
    const cs = cropState;
    const loc = toLocalAt(m.x,m.y,cs.cx,cs.cy,cs.rot);
    const pts = cropHandlePoints();
    let foundHandle = null;
    for(const key in pts){ const p=pts[key]; if(Math.hypot(loc.x-p.x,loc.y-p.y)<16){ foundHandle=key; break; } }
    if(foundHandle){
      cropDrag = { handle:foundHandle, startRect:Object.assign({},cs.rect), startMouse:m };
      return;
    }
    const f = cropFrameLocal();
    if(loc.x>=f.x0 && loc.x<=f.x1 && loc.y>=f.y0 && loc.y<=f.y1){
      cropDrag = { handle:'move', startRect:Object.assign({},cs.rect), startMouse:m };
    }
    return;
  }

  if(lassoState){
    const ls = lassoState;
    const loc = toLocalAt(m.x,m.y,ls.cx,ls.cy,ls.rot);
    const hitIdx = lassoPointAt(ls, loc);
    if(hitIdx>=0){
      ls.dragPointIndex = hitIdx;
      render();
      return;
    }
    const insertIdx = lassoSegmentInsertAt(ls, loc);
    if(insertIdx!==null){
      ls.points.splice(insertIdx, 0, loc);
      ls.dragPointIndex = insertIdx;
      render();
      return;
    }
    ls.points.push(loc);
    ls.dragPointIndex = ls.points.length-1;
    render();
    return;
  }

  const sel = selected();
  if(sel && !sel.locked && sel.type!=='group'){
    const f = frameOf(sel);
    const loc = toLocal(m.x,m.y,sel);
    if(Math.hypot(loc.x-0, loc.y-(-f.h/2-26)) < 18){
      drag = {mode:'rotate', layer:sel, startMouse:m};
      return;
    }
    const pts = handlePoints(f);
    let foundHandle = null;
    for(const key in pts){
      const p = pts[key];
      if(Math.hypot(loc.x-p.x, loc.y-p.y) < 16){ foundHandle = key; break; }
    }
    if(foundHandle){
      const anchorLocal = handleAnchorLocal(foundHandle, f);
      const anchorWorld = toWorldAt(anchorLocal.x, anchorLocal.y, sel.x, sel.y, sel.rotation);
      drag = {
        mode:'resize', handle:foundHandle, layer:sel, startMouse:m,
        startW:sel.w, startH:sel.h, startClipW:sel.clipW, startClipH:sel.clipH,
        anchorWorld, rotation: sel.rotation
      };
      return;
    }
    /* Alt+drag on a framed photo: pan the image inside the fixed frame instead of moving the frame */
    if(e.altKey && sel.type==='image' && sel.clipW){
      const inFrame = Math.abs(loc.x)<=sel.clipW/2 && Math.abs(loc.y)<=sel.clipH/2;
      if(inFrame){
        drag = {
          mode:'pan', layer:sel, startMouse:m,
          startOffX: sel.imgOffsetX||0, startOffY: sel.imgOffsetY||0,
          startLoc: toLocal(m.x,m.y,sel)
        };
        return;
      }
    }
    /* Clicking inside the layer that's ALREADY selected keeps dragging it,
       even if another layer happens to be stacked on top at this exact point. */
    if(Math.abs(loc.x)<=f.w/2 && Math.abs(loc.y)<=f.h/2){
      drag = {mode:'move', layer:sel, startMouse:m, startX:sel.x, startY:sel.y};
      return;
    }
  }

  const hit = hitTest(m.x,m.y);
  if(hit){
    if(hit.parentGroup){
      const g = getLayer(hit.parentGroup);
      selectedId = g.id;
      if(!g.locked){
        const startPositions = {};
        g.children.forEach(cid=>{ const cl=getLayer(cid); if(cl) startPositions[cid]={x:cl.x,y:cl.y}; });
        drag = {mode:'move-group', groupId:g.id, startMouse:m, startPositions};
      }
    } else {
      selectedId = hit.id;
      if(!hit.locked){
        drag = {mode:'move', layer:hit, startMouse:m, startX:hit.x, startY:hit.y};
      }
    }
    refreshLayerList(); renderProps(); render();
  } else {
    selectedId = null;
    refreshLayerList(); renderProps(); render();
  }
});

let clickCycle = {x:-99999, y:-99999, idx:0};
stage.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const m = getMouse(e);
  const matches = layers.filter(l=>{
    if(l.type==='group') return false;
    const f = frameOf(l);
    const loc = toLocal(m.x,m.y,l);
    return Math.abs(loc.x)<=f.w/2 && Math.abs(loc.y)<=f.h/2;
  }).reverse();
  if(matches.length===0) return;
  const same = Math.abs(m.x-clickCycle.x)<6 && Math.abs(m.y-clickCycle.y)<6;
  clickCycle.idx = same ? (clickCycle.idx+1)%matches.length : 0;
  clickCycle.x = m.x; clickCycle.y = m.y;
  const target = matches[clickCycle.idx];
  selectedId = target.parentGroup || target.id;
  refreshLayerList(); renderProps(); render();
});

stage.addEventListener('dblclick', e=>{
  const m = getMouse(e);
  if(lassoState){
    const ls = lassoState;
    const loc = toLocalAt(m.x,m.y,ls.cx,ls.cy,ls.rot);
    const hitIdx = lassoPointAt(ls, loc);
    if(hitIdx>=0){ lassoDeletePoint(ls, hitIdx); render(); }
    return;
  }
  const hit = hitTest(m.x,m.y);
  if(hit && hit.type==='text' && !hit.locked){
    openTextEditor(hit);
  } else if(hit && hit.parentGroup){
    selectedId = hit.id;
    refreshLayerList(); renderProps(); render();
  }
});

let wheelCommitTimer = null;
stage.addEventListener('wheel', e=>{
  const sel = selected();
  if(!sel || sel.locked || sel.type!=='image' || !e.altKey) return;
  const m = getMouse(e);
  const loc = toLocal(m.x,m.y,sel);
  const halfW = (sel.clipW||sel.w)/2, halfH = (sel.clipH||sel.h)/2;
  if(Math.abs(loc.x)>halfW || Math.abs(loc.y)>halfH) return;
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.06 : 0.94;
  if(sel.clipW){
    sel.w = Math.max(sel.clipW*0.3, sel.w*factor);
    sel.h = Math.max(sel.clipH*0.3, sel.h*factor);
  } else {
    sel.w = Math.max(16, sel.w*factor);
    sel.h = Math.max(16, sel.h*factor);
  }
  render();
  clearTimeout(wheelCommitTimer);
  wheelCommitTimer = setTimeout(commitHistory, 400);
}, {passive:false});

window.addEventListener('mousemove', e=>{
  if(panDrag){
    canvasArea.scrollLeft = panDrag.startScrollL - (e.clientX-panDrag.startClientX);
    canvasArea.scrollTop = panDrag.startScrollT - (e.clientY-panDrag.startClientY);
    return;
  }

  if(lassoState && lassoState.dragPointIndex!==null && lassoState.dragPointIndex!==undefined){
    const m = getMouse(e);
    const loc = toLocalAt(m.x,m.y,lassoState.cx,lassoState.cy,lassoState.rot);
    lassoState.points[lassoState.dragPointIndex] = loc;
    render();
    return;
  }

  if(cropDrag){
    const m = getMouse(e);
    const cs = cropState;
    const loc = toLocalAt(m.x,m.y,cs.cx,cs.cy,cs.rot);
    const startLoc = toLocalAt(cropDrag.startMouse.x,cropDrag.startMouse.y,cs.cx,cs.cy,cs.rot);
    const dxFrac = (loc.x-startLoc.x)/cs.w;
    const dyFrac = (loc.y-startLoc.y)/cs.h;
    const sr = cropDrag.startRect;
    const minSize = 0.06;
    let r;
    if(cropDrag.handle==='move'){
      const w = sr.x1-sr.x0, h = sr.y1-sr.y0;
      const x0 = clamp(sr.x0+dxFrac, 0, 1-w);
      const y0 = clamp(sr.y0+dyFrac, 0, 1-h);
      r = {x0, y0, x1:x0+w, y1:y0+h};
    } else {
      r = Object.assign({}, sr);
      if(cropDrag.handle.includes('l')) r.x0 = clamp(sr.x0+dxFrac, 0, sr.x1-minSize);
      if(cropDrag.handle.includes('r')) r.x1 = clamp(sr.x1+dxFrac, sr.x0+minSize, 1);
      if(cropDrag.handle.includes('t')) r.y0 = clamp(sr.y0+dyFrac, 0, sr.y1-minSize);
      if(cropDrag.handle.includes('b')) r.y1 = clamp(sr.y1+dyFrac, sr.y0+minSize, 1);
    }
    cs.rect = r;
    render();
    return;
  }

  if(!drag) return;
  const m = getMouse(e);
  const l = drag.layer;
  if(drag.mode==='move'){
    let nx = drag.startX + (m.x-drag.startMouse.x);
    let ny = drag.startY + (m.y-drag.startMouse.y);
    activeGuides.v = false; activeGuides.h = false;
    if(snapEnabled){
      const snapThresh = 10;
      if(Math.abs(nx-CANVAS_W/2) < snapThresh){ nx = CANVAS_W/2; activeGuides.v = true; }
      if(Math.abs(ny-CANVAS_H/2) < snapThresh){ ny = CANVAS_H/2; activeGuides.h = true; }
    }
    l.x = nx; l.y = ny;
  } else if(drag.mode==='move-group'){
    const dx = m.x-drag.startMouse.x, dy = m.y-drag.startMouse.y;
    Object.keys(drag.startPositions).forEach(cid=>{
      const cl = getLayer(cid); if(!cl) return;
      const sp = drag.startPositions[cid];
      cl.x = sp.x+dx; cl.y = sp.y+dy;
    });
  } else if(drag.mode==='pan'){
    const curLoc = toLocal(m.x,m.y,l);
    l.imgOffsetX = drag.startOffX + (curLoc.x-drag.startLoc.x);
    l.imgOffsetY = drag.startOffY + (curLoc.y-drag.startLoc.y);
  } else if(drag.mode==='resize'){
    const handle = drag.handle;
    const baseW = drag.startClipW || drag.startW;
    const baseH = drag.startClipH || drag.startH;
    const loc = toLocalAt(m.x,m.y, drag.anchorWorld.x, drag.anchorWorld.y, drag.rotation);
    const isCorner = handle==='tl'||handle==='tr'||handle==='bl'||handle==='br';
    let newW = baseW, newH = baseH;
    if(isCorner){
      if(!e.shiftKey){
        let scale = Math.max(Math.abs(loc.x)/baseW, Math.abs(loc.y)/baseH);
        scale = Math.max(scale, 16/Math.min(baseW,baseH));
        newW = baseW*scale; newH = baseH*scale;
      } else {
        newW = Math.max(16, Math.abs(loc.x));
        newH = Math.max(16, Math.abs(loc.y));
      }
    } else if(handle==='t' || handle==='b'){
      newH = Math.max(16, Math.abs(loc.y));
    } else if(handle==='l' || handle==='r'){
      newW = Math.max(16, Math.abs(loc.x));
    }
    newW = Math.max(16,newW); newH = Math.max(16,newH);

    if(l.clipW){
      const rw = newW/drag.startClipW, rh = newH/drag.startClipH;
      l.clipW = newW; l.clipH = newH;
      l.w = drag.startW*rw; l.h = drag.startH*rh;
    } else {
      l.w = newW; l.h = newH;
    }
    if(l.type==='emoji'){ l.size = Math.round(Math.max(l.w,l.h)); }

    /* reposition so the opposite corner/edge (the anchor) stays fixed in world space, i.e. the shape grows toward the dragged handle */
    const signX = (handle.includes('r')) ? 1 : (handle.includes('l') ? -1 : 0);
    const signY = (handle.includes('b')) ? 1 : (handle.includes('t') ? -1 : 0);
    const centerLocal = { x: signX*newW/2, y: signY*newH/2 };
    const newCenter = toWorldAt(centerLocal.x, centerLocal.y, drag.anchorWorld.x, drag.anchorWorld.y, drag.rotation);
    l.x = newCenter.x; l.y = newCenter.y;
  } else if(drag.mode==='rotate'){
    const dx = m.x-l.x, dy = m.y-l.y;
    let deg = Math.atan2(dy,dx)*180/Math.PI + 90;
    l.rotation = Math.round(deg);
  }
  render();
});

window.addEventListener('mouseup', ()=>{
  if(panDrag){ panDrag=null; stage.style.cursor = handToolActive ? 'grab' : ''; return; }
  if(lassoState && lassoState.dragPointIndex!==null && lassoState.dragPointIndex!==undefined){ lassoState.dragPointIndex=null; render(); return; }
  if(cropDrag){ cropDrag=null; return; }
  if(drag){
    if(drag.mode==='resize' && (drag.layer.type==='shape'||drag.layer.type==='emoji')){
      finishInteractiveEffectUpdate(drag.layer);
    }
    activeGuides.v = false; activeGuides.h = false;
    render();
    commitHistory();
  }
  drag=null;
});

window.addEventListener('keydown', e=>{
  const tag = document.activeElement.tagName;
  const inEditable = tag==='TEXTAREA' || tag==='INPUT' || document.activeElement.isContentEditable;
  if(cropState){
    if(e.key==='Escape'){ cancelCrop(); return; }
    if(e.key==='Enter'){ applyCrop(); return; }
  }
  if(lassoState){
    if(e.key==='Escape'){ cancelLasso(); return; }
    if(e.key==='Enter'){ applyLasso(); return; }
  }
  if((e.key==='Delete'||e.key==='Backspace') && selectedId && !inEditable){
    const l = selected();
    if(l && l.locked) return;
    removeLayer(selectedId);
    return;
  }
  if((e.ctrlKey||e.metaKey) && !inEditable){
    const k = e.key.toLowerCase();
    if(k==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
    else if(k==='y'){ e.preventDefault(); redo(); }
    else if(k==='c'){ if(copySelection()) e.preventDefault(); }
    else if(k==='v'){ if(clipboardLayers.length){ e.preventDefault(); pasteClipboard(); } }
  }
});

/* ============================= EXPORT ============================= */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const prevSel = selectedId;
  selectedId = null;
  render();
  const link = document.createElement('a');
  link.download = 'halftone-studio.png';
  link.href = stage.toDataURL('image/png');
  link.click();
  selectedId = prevSel;
  render();
});

/* ============================= INIT ============================= */
updateBgUI();
render();
document.fonts.ready.then(render);
history = [snapshotState()];
historyIndex = 0;
updateUndoRedoButtons();
</script>
</body>
